{% extends 'auth_base.html' %}

{% block title %}Recuperar senha — SCSI{% endblock %}

{% block content %}
    <h5 class="mb-3">Recuperar senha</h5>
    <p class="text-muted fs-12 mb-4">
        Informe seu e-mail cadastrado e enviaremos as instruções para redefinir sua senha.
    </p>

    <form method="post" novalidate>
        {% csrf_token %}
        <div class="mb-3">
            <label for="id_email" class="form-label">E-mail</label>
            <input type="email" name="email" id="id_email" class="form-control"
                   placeholder="voce@corretora.com.br" autofocus required>
        </div>
        <div class="d-grid gap-2">
            <button type="submit" class="btn btn-primary">Enviar instruções</button>
        </div>
    </form>

    <div class="text-center mt-3">
        <a href="{% url 'login' %}" class="fs-12">Voltar para o login</a>
    </div>
{% endblock %}
