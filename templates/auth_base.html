{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}SCSI{% endblock %}</title>
    <link rel="shortcut icon" type="image/x-icon" href="{% static 'images/favicon.ico' %}">
    <link rel="stylesheet" type="text/css" href="{% static 'css/bootstrap.min.css' %}">
    <link rel="stylesheet" type="text/css" href="{% static 'css/vendors.min.css' %}">
    <link rel="stylesheet" type="text/css" href="{% static 'css/theme.min.css' %}">
    <style>
        .auth-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bs-gray-100);
            padding: 24px;
        }
        .auth-card {
            width: 100%;
            max-width: 440px;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="text-center mb-4">
                <img src="{% static 'images/logo-full.png' %}" alt="SCSI" class="img-fluid" style="max-height: 48px;">
            </div>
            <div class="card stretch">
                <div class="card-body">
                    {% block content %}{% endblock %}
                </div>
            </div>
            <p class="text-center text-muted fs-12 mt-4 mb-0">
                SCSI — Sistema de Gestão para Corretora de Seguros Inteligente
            </p>
        </div>
    </div>
    <script src="{% static 'js/vendors.min.js' %}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
