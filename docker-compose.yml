name: scsi

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: scsi
      POSTGRES_USER: scsi
      POSTGRES_PASSWORD: scsi
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U scsi -d scsi']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  rabbitmq:
    image: rabbitmq:3.13-alpine
    ports:
      - '5672:5672'
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', 'check_port_connectivity']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DEBUG: 'True'
      ALLOWED_HOSTS: '*'
      DATABASE_URL: postgres://scsi:scsi@postgres:5432/scsi
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: amqp://rabbitmq:5672//
    volumes:
      - ./media:/app/media
      - staticfiles:/app/staticfiles
    ports:
      - '8000:8000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:8000/health/ || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.scsi-app.rule=Host(`localhost`)'
      - 'traefik.http.services.scsi-app.loadbalancer.server.port=8000'

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ['/app/entrypoint-celery.sh']
    env_file:
      - .env
    environment:
      CELERY_ROLE: worker
      DATABASE_URL: postgres://scsi:scsi@postgres:5432/scsi
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: amqp://rabbitmq:5672//
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'celery -A core inspect ping -d celery@$$HOSTNAME --timeout 5 2>/dev/null || exit 1']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ['/app/entrypoint-celery.sh']
    env_file:
      - .env
    environment:
      CELERY_ROLE: beat
      DATABASE_URL: postgres://scsi:scsi@postgres:5432/scsi
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: amqp://rabbitmq:5672//
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'pgrep -f "celery.*beat" > /dev/null || exit 1']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  traefik:
    image: traefik:v3
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.ping.address=:8080
      - --ping=true
      - --ping.entrypoint=ping
    ports:
      - '80:80'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test:
        [
          'CMD',
          'traefik',
          'healthcheck',
          '--ping=true',
          '--ping.entrypoint=ping',
          '--entrypoints.ping.address=:8080',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  staticfiles:
