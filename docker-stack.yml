# Docker Swarm stack de produção para o SCSI.
# Deploy: docker stack deploy -c docker-stack.yml --with-registry-auth scsi_v1
#
# Pré-requisitos:
#   - Swarm ativo (docker swarm init)
#   - Redes: traefik_public (external), scsi_v1_internal (internal), scsi_v1_egress
#   - Secrets: CLOUDFLARE_DNS_API_TOKEN, DJANGO_SECRET_KEY, POSTGRES_PASSWORD, OPENAI_API_KEY
#   - .env.production (gitignored) na VPS com configurações não-secret

version: "3.8"

x-common-restart: &common-restart
  restart_policy:
    condition: on-failure
    delay: 5s
    max_attempts: 5
    window: 120s

x-app-resources: &app-resources
  resources:
    limits:
      cpus: "1.0"
      memory: 512M
    reservations:
      cpus: "0.25"
      memory: 128M

x-db-resources: &db-resources
  resources:
    limits:
      cpus: "1.0"
      memory: 1G
    reservations:
      cpus: "0.25"
      memory: 256M

services:
  traefik:
    image: traefik:v3
    command:
      - --providers.docker.swarmMode=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=traefik_public
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.ping.address=:8080
      - --ping=true
      - --ping.entrypoint=ping
      - --certificatesresolvers.letsencrypt.acme.email=admin@scsi.digital
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.dnschallenge.provider=cloudflare
      - --certificatesresolvers.letsencrypt.acme.dnschallenge.resolvers=1.1.1.1:53,1.0.0.1:53
    environment:
      CF_DNS_API_TOKEN_FILE: /run/secrets/CLOUDFLARE_DNS_API_TOKEN
    ports:
      - target: 80
        published: 80
        mode: host
      - target: 443
        published: 443
        mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - scsi_v1_certs:/letsencrypt
    secrets:
      - CLOUDFLARE_DNS_API_TOKEN
    networks:
      - traefik_public
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping=true", "--ping.entrypoint=ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    <<: *common-restart
    resources:
      limits:
        cpus: "0.5"
        memory: 256M

  app:
    image: ghcr.io/pycodebr/scsi_v1:latest
    env_file:
      - .env.production
    environment:
      DEBUG: "False"
      SECRET_KEY_FILE: /run/secrets/DJANGO_SECRET_KEY
      OPENAI_API_KEY_FILE: /run/secrets/OPENAI_API_KEY
    secrets:
      - DJANGO_SECRET_KEY
      - OPENAI_API_KEY
    volumes:
      - scsi_v1_media:/app/media
      - scsi_v1_staticfiles:/app/staticfiles
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
        delay: 10s
      labels:
        - traefik.enable=true
        - traefik.http.routers.scsi-app.rule=Host(`scsi.digital`) || HostRegexp(`{subdomain:[a-z0-9]+}.scsi.digital`)
        - traefik.http.routers.scsi-app.entrypoints=websecure
        - traefik.http.routers.scsi-app.tls=true
        - traefik.http.routers.scsi-app.tls.certresolver=letsencrypt
        - traefik.http.routers.scsi-app.tls.domains[0].main=scsi.digital
        - traefik.http.routers.scsi-app.tls.domains[0].sans=*.scsi.digital
        - traefik.http.services.scsi-app.loadbalancer.server.port=8000
        - traefik.http.routers.scsi-app.middlewares=scsi-https-redirect
        - traefik.http.middlewares.scsi-https-redirect.redirectscheme.scheme=https
        - traefik.http.routers.scsi-http.rule=Host(`scsi.digital`) || HostRegexp(`{subdomain:[a-z0-9]+}.scsi.digital`)
        - traefik.http.routers.scsi-http.entrypoints=web
        - traefik.http.routers.scsi-http.middlewares=scsi-https-redirect
      <<: *common-restart
      <<: *app-resources
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - traefik_public
      - scsi_v1_internal
    depends_on:
      - db
      - redis
      - rabbitmq

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: scsi
      POSTGRES_USER: scsi
      POSTGRES_PASSWORD_FILE: /run/secrets/POSTGRES_PASSWORD
    secrets:
      - POSTGRES_PASSWORD
    volumes:
      - scsi_v1_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scsi -d scsi"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    <<: *common-restart
    <<: *db-resources
    networks:
      - scsi_v1_internal

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - scsi_v1_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    <<: *common-restart
    <<: *app-resources
    networks:
      - scsi_v1_internal

  rabbitmq:
    image: rabbitmq:3.13-alpine
    volumes:
      - scsi_v1_rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    <<: *common-restart
    <<: *app-resources
    networks:
      - scsi_v1_internal

  celery_worker:
    image: ghcr.io/pycodebr/scsi_v1:latest
    command: ["/app/entrypoint-celery.sh"]
    env_file:
      - .env.production
    environment:
      CELERY_ROLE: worker
      OPENAI_API_KEY_FILE: /run/secrets/OPENAI_API_KEY
    secrets:
      - OPENAI_API_KEY
    healthcheck:
      test: ["CMD-SHELL", "celery -A core inspect ping -d celery@$$HOSTNAME --timeout 5 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    <<: *common-restart
    <<: *app-resources
    networks:
      - scsi_v1_internal
      - scsi_v1_egress
    depends_on:
      - db
      - redis
      - rabbitmq

  celery_beat:
    image: ghcr.io/pycodebr/scsi_v1:latest
    command: ["/app/entrypoint-celery.sh"]
    env_file:
      - .env.production
    environment:
      CELERY_ROLE: beat
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'celery.*beat' > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    <<: *common-restart
    <<: *app-resources
    networks:
      - scsi_v1_internal
      - scsi_v1_egress
    depends_on:
      - db
      - redis
      - rabbitmq

networks:
  traefik_public:
    external: true
  scsi_v1_internal:
    driver: overlay
    internal: true
    attachable: false
  scsi_v1_egress:
    driver: overlay

volumes:
  scsi_v1_postgres:
  scsi_v1_redis:
  scsi_v1_rabbitmq:
  scsi_v1_media:
  scsi_v1_staticfiles:
  scsi_v1_certs:

secrets:
  CLOUDFLARE_DNS_API_TOKEN:
    external: true
  DJANGO_SECRET_KEY:
    external: true
  POSTGRES_PASSWORD:
    external: true
  OPENAI_API_KEY:
    external: true
